<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F4F4F4; overflow: hidden; font-family: 'IBM Plex Mono', monospace; }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 24px;
    left: 24px;
    color: #8A8A8A;
    font-size: 11px;
    letter-spacing: 0.08em;
    line-height: 1.8;
    pointer-events: none;
    text-transform: uppercase;
  }
  #logo {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 10;
    display: block;
    width: 72px;
  }
  #logo svg {
    width: 100%;
    height: auto;
    fill: #8A8A8A;
    display: block;
  }
  #credit {
    position: fixed;
    bottom: 24px;
    right: 24px;
    color: #8A8A8A;
    font-size: 11px;
    letter-spacing: 0.08em;
    pointer-events: none;
    text-transform: uppercase;
  }
  #loading {
    position: fixed;
    inset: 0;
    background: #F4F4F4;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  #loading-text {
    color: #8A8A8A;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #loading-bar-wrap {
    width: 120px;
    height: 1px;
    background: rgba(0,0,0,0.1);
  }
  #loading-bar {
    height: 1px;
    width: 0%;
    background: #8A8A8A;
    transition: width 0.3s ease;
  }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    cursor: pointer;
  }
  #lightbox-frame {
    position: relative;
    z-index: 201;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: lb-in 0.2s ease;
  }
  @keyframes lb-in {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  #lightbox-close {
    position: absolute;
    top: -36px;
    right: 0;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.15s;
  }
  #lightbox-close:hover { color: #fff; }
  #lightbox-img {
    display: block;
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div id="loading">
  <div id="loading-text">Loading Universe</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<div id="lightbox">
  <div id="lightbox-backdrop"></div>
  <div id="lightbox-frame">
    <button id="lightbox-close">&#x2715;</button>
    <img id="lightbox-img" src="" alt="">
  </div>
</div>
